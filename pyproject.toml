[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asfi-alerta-temprana"
version = "0.1.0"
description = "Sistema de Alerta Temprana Estocástica sobre EEFF Bancarios (ASFI Bolivia)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Proyecto Procesos Estocásticos" }]
dependencies = [
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0,<6",
    "pandas>=2.1,<3",
    "numpy>=1.26,<3",
    "pyarrow>=14.0,<18",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0,<3",
    "PyYAML>=6.0,<7",
    "scipy>=1.11,<2",
    "statsmodels>=0.14,<0.15",
    "pmdarima>=2.0,<3",
    "joblib>=1.3,<2",
    "pydantic>=2.5,<3",
    "tenacity>=8.2,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
    "pytest-cov>=4.1,<6",
    "ruff>=0.4,<1",
    "black>=24.1,<26",
    "jupyter>=1.0,<2",
    "ipykernel>=6.29,<7",
    "matplotlib>=3.8,<4",
]

[tool.setuptools]
packages = [
    "src",
    "src.scraping",
    "src.etl",
    "src.indicators",
    "src.models",
    "src.backtest",
    "src.export",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]
