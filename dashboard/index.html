<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vigía · Monitor de bancos</title>
<style>
:root{--paper:#F4F6F8;--card:#fff;--ink:#14232F;--mute:#5B6B78;--line:#DDE3E8;--acc:#0F6E7A;--ok:#2F855A;--warn:#B7791F;--hot:#C0462B;--okbg:#E6F3EC;--warnbg:#FBF1DC;--hotbg:#F9E6E1;--serif:Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:rgba(244,246,248,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:980px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{font:700 22px var(--serif);letter-spacing:-.01em;margin-right:auto}
.brand small{font:400 13px var(--sans);color:var(--mute);margin-left:8px}
nav{display:flex;gap:4px}
nav button,.tog{border:0;background:none;padding:8px 14px;border-radius:99px;font-weight:600;color:var(--mute)}
nav button.on{background:var(--ink);color:#fff}
.tog{border:1px solid var(--line);background:var(--card);font-weight:500;display:flex;gap:8px;align-items:center}
.tog i{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background .2s}
.tog i:after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s}
.tog[aria-pressed=true] i{background:var(--acc)}.tog[aria-pressed=true] i:after{left:14px}
main{max-width:980px;margin:auto;padding:32px 20px 24px}
h1{font:700 clamp(28px,5vw,44px)/1.12 var(--serif);letter-spacing:-.02em;margin:0 0 10px;max-width:20em}
.lead{color:var(--mute);max-width:42em;margin:0 0 28px}
.chip{display:inline-block;padding:3px 11px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.hot{background:var(--hotbg);color:var(--hot)}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr 100px 150px;gap:16px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:16px 20px}
.row:last-child{border:0}.row:hover{background:#F8FAFB}
.row>span:last-child{text-align:right}.row b{display:block;font-size:17px}.row small{color:var(--mute);font-size:14px}
.sc{font:13px var(--sans);color:var(--mute);margin-left:8px}
.back{border:0;background:none;color:var(--acc);font-weight:600;padding:0;margin-bottom:14px}
.head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.head h1{margin:0;font-size:clamp(26px,4vw,36px)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}
.chips button{border:1px solid var(--line);background:var(--card);padding:6px 14px;border-radius:99px;font-size:14px}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:16px}
.big{font:700 clamp(40px,8vw,64px)/1 var(--serif);letter-spacing:-.03em}
.big span{font-size:.45em;color:var(--mute);margin-left:4px}
.say{font-size:18px;margin:10px 0 0;max-width:36em}
svg.ch{width:100%;height:auto;display:block;margin-top:18px}
.leg{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:8px}
.leg i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
h2{font:700 20px var(--serif);margin:0 0 6px}
.panel p{margin:6px 0;color:#2b3b47}
details{margin-top:12px;color:var(--mute);font-size:14px}summary{cursor:pointer;color:var(--acc);font-weight:600}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:10px 0 0;font-size:14px}dt{color:var(--mute)}dd{margin:0}
.exp{border-style:dashed;background:#FBFCFD}
.fil{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.al{padding:14px 20px;border-bottom:1px solid var(--line)}.al:last-child{border:0}
.al small{color:var(--mute);display:block;margin-top:4px}
.more{display:block;margin:18px auto 0;border:1px solid var(--line);background:var(--card);padding:10px 22px;border-radius:99px;font-weight:600}
footer{max-width:980px;margin:auto;padding:8px 20px 40px;color:var(--mute);font-size:13px}
@media(max-width:620px){.row{grid-template-columns:1fr auto}.row svg{display:none}.bar{gap:10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="bar" id="top"></div></header>
<main id="app"></main>
<footer>Vigía describe cuándo un indicador se aleja de lo habitual para cada banco. No predice quiebras ni es una calificación de solvencia. Fuente: estados financieros de bancos múltiples, ASFI Bolivia.</footer>
<script src="data.js"></script>
<script>
const D=window.ASFI_DATA,B=Object.fromEntries(D.bancos.map(b=>[b.id,b])),I=Object.fromEntries(D.indicadores_meta.map(i=>[i.id,i]));
const f=(v,d=2)=>v==null?'–':v.toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d});
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fecha=s=>{const[a,m]=s.split('-');return MES[+m-1]+' '+a};
const ST={verde:['Normal','ok'],amarillo:['Observar','warn'],naranja:['Observar','warn'],rojo:['Inusual','hot']};
const SV={vigilancia:['Para observar','warn'],alerta:['Atención','warn'],critica:['Muy inusual','hot']};
const chip=(t,c)=>`<span class="chip ${c}">${t}</span>`;
let S={view:'resumen',bank:null,ind:'mora',exp:false,sev:'todas',lim:25};

function read(s){
  const p=s&&s.prediccion_un_paso;if(!s||!p||!p.ic95_inf)return null;
  const n=s.observado.length-1,v=s.observado[n],lo=p.ic95_inf[n],hi=p.ic95_sup[n];
  const pos=v>hi?'up':v<lo?'down':'in',worse=(pos=='up'&&s.direccion_riesgo=='ascendente')||(pos=='down'&&s.direccion_riesgo=='descendente');
  return{v,lo,hi,pos,worse};
}
const verdict=r=>r.pos=='in'?'dentro de lo normal':r.worse?'peor de lo esperado':'mejor de lo esperado';
function spark(a,w=96,h=28){
  const mn=Math.min(...a),mx=Math.max(...a),k=i=>[i*(w-2)/(a.length-1)+1,h-3-(a[i]-mn)/((mx-mn)||1)*(h-6)];
  return`<svg width="${w}" height="${h}" aria-hidden="true"><polyline fill="none" stroke="#0F6E7A" stroke-width="1.8" points="${a.map((_,i)=>k(i).join(',')).join(' ')}"/></svg>`;
}
function chart(s){
  const N=48,o=s.observado.slice(-N),pp=s.prediccion_un_paso,lo=pp?pp.ic95_inf.slice(-N):[],hi=pp?pp.ic95_sup.slice(-N):[],fc=s.pronostico,m=fc?fc.media.length:0;
  const all=[...o,...lo,...hi,...(fc?[...fc.ic95_inf,...fc.ic95_sup]:[])].filter(x=>x!=null),mn=Math.min(...all),mx=Math.max(...all);
  const W=900,H=300,L=44,R=10,T=10,Bt=26,X=i=>L+i*(W-L-R)/(N+m-1),Y=v=>T+(mx-v)/((mx-mn)||1)*(H-T-Bt);
  const band=(a,b,off)=>{const u=a.map((v,i)=>[X(i+off),Y(b[i])]),d=a.map((v,i)=>[X(i+off),Y(v)]).reverse();return[...u,...d].map(p=>p.join(',')).join(' ')};
  const line=(a,off)=>a.map((v,i)=>[X(i+off),Y(v)].join(',')).join(' ');
  let g=`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del indicador con su rango esperado">`;
  for(let t=0;t<=4;t++){const v=mn+(mx-mn)*t/4;g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E7ECF0"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="#5B6B78">${f(v,1)}</text>`}
  if(lo.length)g+=`<polygon points="${band(lo,hi,0)}" fill="#0F6E7A" opacity=".13"/>`;
  if(m){g+=`<polygon points="${band(fc.ic95_inf,fc.ic95_sup,N)}" fill="#B7791F" opacity=".16"/><polyline fill="none" stroke="#B7791F" stroke-width="2" stroke-dasharray="6 5" points="${line(fc.media,N)}"/>`}
  g+=`<polyline fill="none" stroke="#14232F" stroke-width="2.4" points="${line(o,0)}"/><circle cx="${X(N-1)}" cy="${Y(o[N-1])}" r="5" fill="#14232F"/>`;
  const ds=s.fechas.slice(-N);[0,12,24,36,47].forEach(i=>g+=`<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="12" fill="#5B6B78">${fecha(ds[i])}</text>`);
  return g+'</svg>'+`<div class="leg"><span><i style="background:#14232F"></i>Dato real</span><span><i style="background:#0F6E7A;opacity:.3"></i>Rango esperado</span>${m?'<span><i style="background:#B7791F;opacity:.5"></i>Pronóstico (próximos 12 meses)</span>':''}</div>`;
}
const RF=[...new Set(D.alertas.map(a=>a.fecha))].sort().reverse().slice(0,3);
function bankSentence(b){const r=read(D.series[b.id].mora),k=D.alertas.filter(a=>a.banco_id==b.id&&RF.includes(a.fecha)).length;
  const m=r?`Mora ${f(r.v)} %: ${verdict(r)}.`:`Mora ${f(b.sparkline_mora.at(-1))} %.`;
  return m+(k?` ${k} ${k==1?'aviso':'avisos'} en los últimos 3 meses.`:' Sin avisos recientes.')}

function topbar(){
  document.getElementById('top').innerHTML=`<div class="brand">Vigía<small>Monitor de bancos</small></div><nav>${[['resumen','Resumen'],['avisos','Avisos']].map(([k,t])=>`<button data-go="${k}" class="${S.view==k||(k=='resumen'&&S.view=='banco')?'on':''}">${t}</button>`).join('')}</nav><button class="tog" data-exp aria-pressed="${S.exp}"><i></i>Modo experto</button>`;
}
function resumen(){
  const bs=[...D.bancos].sort((a,b)=>b.score_anomalia-a.score_anomalia),n=bs.filter(b=>b.semaforo=='rojo').length,f1=D.meta.rango_fechas[1];
  return`<h1>${n} de ${bs.length} bancos muestran movimientos inusuales</h1><p class="lead">Datos hasta ${fecha(f1)}. “Inusual” significa que un indicador se alejó de lo habitual para ese banco. No significa que el banco esté en peligro. Toca un banco para ver el detalle.</p><div class="list">${bs.map(b=>{const[t,c]=ST[b.semaforo];return`<button class="row" data-bank="${b.id}"><span><b>${b.nombre}</b><small>${bankSentence(b)}</small></span>${spark(b.sparkline_mora)}<span>${chip(t,c)}${S.exp?`<span class="sc">score ${f(b.score_anomalia)}</span>`:''}</span></button>`}).join('')}</div>`;
}
function banco(){
  const b=B[S.bank],s=D.series[b.id][S.ind],m=I[S.ind],u=m.unidad||'',r=read(s),[t,c]=ST[b.semaforo],mk=D.markov.por_banco[b.id];
  let h=`<button class="back" data-go="resumen">← Todos los bancos</button><div class="head"><h1>${b.nombre}</h1>${chip(t,c)}</div><div class="chips">${D.indicadores_meta.map(i=>`<button data-ind="${i.id}" class="${i.id==S.ind?'on':''}">${i.nombre}</button>`).join('')}</div>`;
  h+=`<div class="panel"><div class="big">${f(s.observado.at(-1))}<span>${u}</span></div>`;
  h+=r?`<p class="say">Esperábamos entre ${f(r.lo)} y ${f(r.hi)} ${u}. Está ${verdict(r)}.</p>`:`<p class="say">No hay suficientes datos para estimar un rango esperado.</p>`;
  h+=chart(s);
  if(s.backtest){const ok=s.backtest.supera_baseline;h+=`<p><b>Confianza del pronóstico: ${ok?'aceptable':'baja'}.</b> ${ok?'En una prueba con los últimos 12 meses, superó a un método simple.':'En una prueba con los últimos 12 meses, un método simple (repetir el último dato) acertó más. Úsalo como referencia, no como cifra firme.'}</p>`}
  h+=`<details><summary>¿Cómo leer este gráfico?</summary><p>La línea oscura es el dato real de cada mes. La franja azul es el rango en que el historial hacía esperar el dato. Si la línea sale de la franja, el mes fue inusual. La zona ámbar es el pronóstico para el próximo año.</p></details></div>`;
  if(S.ind=='mora'&&mk){
    const e=D.markov.estados,u2=D.markov.umbrales.map(x=>x*100),k=mk.estado_actual,rg=['menos de '+f(u2[0],1)+' %','entre '+f(u2[0],1)+' % y '+f(u2[1],1)+' %','entre '+f(u2[1],1)+' % y '+f(u2[2],1)+' %','más de '+f(u2[2],1)+' %'];
    h+=`<div class="panel"><h2>¿En qué nivel de mora está y cuánto suele durar?</h2><p>Hoy está en nivel <b>${e[k]}</b> (${rg[k]}). Históricamente, este banco se queda unos <b>${f(mk.tiempo_permanencia_meses[k],0)} meses</b> en ese nivel antes de cambiar.</p><p>Probabilidad de estar en nivel Crítica dentro de 3 meses: <b>${f(mk.prob_critico_h.m3*100,0)} %</b>; dentro de 6 meses: <b>${f(mk.prob_critico_h.m6*100,0)} %</b>. Es una descripción de su comportamiento pasado, no un pronóstico de quiebra.</p></div>`}
  if(S.exp){const a=s.estacionariedad||{},q=s.sarima||{},bt=s.backtest||{};
    h+=`<div class="panel exp"><h2>Detalle técnico</h2><dl><dt>Estacionariedad</dt><dd>${a.veredicto||'–'} (ADF p=${f(a.adf_pval,3)}, KPSS p=${f(a.kpss_pval,3)})</dd><dt>Diferenciación</dt><dd>d=${a.d_recomendado??'–'}, D=${a.D_estacional??'–'}</dd><dt>Modelo SARIMA</dt><dd>${q.orden?`(${q.orden.join(',')})(${q.orden_estacional.join(',')}) · AIC ${f(q.aic,1)}`:'–'}</dd><dt>RMSE modelo / Naive</dt><dd>${f(bt.rmse_modelo,3)} / ${f(bt.rmse_naive,3)}</dd><dt>Score de anomalía</dt><dd>${f(b.score_anomalia)}</dd></dl></div>`}
  return h;
}
function avisos(){
  const fs=[...new Set(D.alertas.map(a=>a.fecha))].sort().reverse().slice(0,6),min=fs.at(-1);
  const all=D.alertas.filter(a=>a.fecha>=min).sort((a,b)=>b.fecha.localeCompare(a.fecha)),L=all.filter(a=>S.sev=='todas'||a.severidad==S.sev),v=L.slice(0,S.lim);
  return`<h1>Avisos de los últimos 6 meses</h1><p class="lead">Cada aviso indica qué indicador de qué banco se movió de forma inusual y por qué. Son ${all.length} en total desde ${fecha(min)}.</p><div class="fil chips">${[['todas','Todos'],['critica','Muy inusuales'],['alerta','Atención'],['vigilancia','Para observar']].map(([k,t])=>`<button data-sev="${k}" class="${S.sev==k?'on':''}">${t}</button>`).join('')}</div><div class="list">${v.map(a=>{const[t,c]=SV[a.severidad];return`<div class="al">${chip(t,c)} <b>${B[a.banco_id]?.nombre||a.banco_id}</b> · ${I[a.indicador_id]?.nombre||a.indicador_id}<small>${fecha(a.fecha)}. ${a.explicacion_clara.split(': ').slice(1).join(': ')}</small></div>`}).join('')||'<div class="al">No hay avisos con este filtro.</div>'}</div>${L.length>v.length?`<button class="more" data-more>Ver más avisos (${L.length-v.length})</button>`:''}`;
}
function render(){topbar();document.getElementById('app').innerHTML=S.view=='banco'?banco():S.view=='avisos'?avisos():resumen();}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-bank],[data-ind],[data-sev],[data-exp],[data-more]');if(!t)return;
  if(t.dataset.go){S.view=t.dataset.go}else if(t.dataset.bank){S.view='banco';S.bank=t.dataset.bank}else if(t.dataset.ind){S.ind=t.dataset.ind}else if(t.dataset.sev){S.sev=t.dataset.sev;S.lim=25}else if('exp' in t.dataset){S.exp=!S.exp}else if('more' in t.dataset){S.lim+=25}
  render();if(t.dataset.go||t.dataset.bank)scrollTo(0,0);
});
render();
</script>
</body>
</html>
